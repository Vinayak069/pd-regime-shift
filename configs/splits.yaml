# Frozen 2026-10-20 (revised the same day before any model was fitted; see CHANGELOG).
# Windows are calendar months of observation, inclusive.
# Rule: every label a model, a selector or a static recalibrator sees closes before the
# first test month T0. Monthly hazards train on rows with t + 1 <= train end; 12-month
# labels of validation snapshots close by validate end + 12 <= T0 - 1, hence the 12-month gap.
experiments:
  control:
    train: [null, 2011-12]
    validate: [2012-01, 2012-12]
    gap: [2013-01, 2013-12]
    test: [2014-01, 2016-12]
  crisis_2008:
    train: [null, 2004-12]
    validate: [2005-01, 2005-12]
    gap: [2006-01, 2006-12]
    test: [2007-01, 2010-12]
  covid:
    train: [null, 2017-12]
    validate: [2018-01, 2018-12]
    gap: [2019-01, 2019-12]
    test: [2020-01, 2022-12]
horizons_months: [12, 36, 60]
label_delay_months: 12   # a 12-month default label for month t is usable only from t+12
